server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend Static Files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy to CoreGeeks API (prevents CORS and network issues on NAS)
    location /api/ {
        proxy_pass https://api2.core-geeks.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host api2.core-geeks.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Authorization, Accept, Content-Type" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Static Cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
